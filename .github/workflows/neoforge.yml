name: NeoForge 1.21.1 port
on:
  push:
    branches: ['port/neoforge-1.21.1']
    paths-ignore: ['.github/workflows/migrate.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neoforge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile native NeoForge sources
        run: ./gradlew build --stacktrace -Pbuild_number=${{ github.run_number }}
      - name: Compile native GameTests and client harness
        run: ./gradlew gametestClasses --stacktrace
      - name: Native GameTests
        run: |
          ./gradlew runGameTestServer --stacktrace
          python3 scripts/check-junit.py build/gametest/junit.xml
      - name: Install Xvfb and software OpenGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Native client scenario
        run: bash scripts/ci-harness.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neoforge-port-${{ github.run_number }}
          path: |
            build/libs/
            build/reports/
            build/gametest/junit.xml
            build/gametest/logs/
            build/harness-server/logs/
            build/harness-client/logs/
            build/harness-client/harness-result.txt
            build/harness-client/screenshots/
            build/harness-client/crash-reports/
