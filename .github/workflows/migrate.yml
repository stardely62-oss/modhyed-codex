name: Migrate source mappings
on:
  push:
    branches: ['port/neoforge-1.21.1']
    paths: ['.github/workflows/migrate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Remap Java sources to Mojang names
        run: |
          ./gradlew migrateMappings --mappings net.minecraft:mappings:1.20.1 --input src/main/java --output remapped/main --stacktrace
          ./gradlew migrateMappings --mappings net.minecraft:mappings:1.20.1 --input src/gametest/java --output remapped/gametest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: mojang-sources
          path: remapped/
