name: NeoForge 1.21.1 port
on:
  push:
    branches: [main, 'port/neoforge-1.21.1']
    paths-ignore: ['.github/workflows/migrate.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neoforge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Compile native NeoForge sources
        run: ./gradlew build --stacktrace -Pbuild_number=${{ github.run_number }}
      - name: Compile native GameTests and client harness
        run: ./gradlew gametestClasses --stacktrace
      - name: Native GameTests
        run: |
          ./gradlew runGameTestServer --stacktrace
          python3 scripts/check-junit.py build/gametest/junit.xml
      - name: Install Xvfb and software OpenGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Native client scenario
        run: bash scripts/ci-harness.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neoforge-port-${{ github.run_number }}
          path: |
            build/libs/
            build/reports/
            build/gametest/junit.xml
            build/gametest/logs/
            build/harness-server/logs/
            build/harness-client/logs/
            build/harness-client/harness-result.txt
            build/harness-client/screenshots/
            build/harness-client/crash-reports/

  publish:
    needs: compile
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: neoforge-port-${{ github.run_number }}
          path: build
      - name: Publish verified NeoForge build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(find build/libs -maxdepth 1 -name 'ender-obelisks-*.jar' ! -name '*-sources.jar' -print -quit)
          test -n "$JAR"
          cp build/harness-client/screenshots/menu_tier4.png screenshot.png
          zip -j ender-obelisks-updater.zip tools/update-ender-obelisks.bat tools/update-ender-obelisks.ps1
          gh release delete neoforge-dev --yes --cleanup-tag || true
          gh release create neoforge-dev "$JAR" screenshot.png build/harness-client/screenshots/*.png ender-obelisks-updater.zip \
            --prerelease --target "$GITHUB_SHA" --title "NeoForge 1.21.1 Codex build ${{ github.run_number }}" \
            --notes "Java 21, NeoForge 21.1.265+. Build, native GameTests and real-client harness passed. Use the isolated Codex NeoForge installer. Fabric dev releases are retained separately."
