plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = project.mod_version + (project.hasProperty('build_number') ? "+build.${project.build_number}" : '')
group = project.maven_group
base { archivesName = project.archives_base_name }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
sourceSets {
    jmstubs { compileClasspath += configurations.compileClasspath }
    main { compileClasspath += jmstubs.output }
}
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
    exclude 'fabric.mod.json'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xmaxerrs', '1000']
}
jar { from('LICENSE') }

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        resources.exclude 'fabric.mod.json'
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}
neoForge {
    addModdingDependenciesTo sourceSets.gametest
    mods {
        ender_obelisks_test { sourceSet(sourceSets.gametest) }
    }
    runs {
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            gameDirectory = file('build/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ender_obelisks'
            systemProperty 'ender_obelisks.gametest', 'true'
        }
        genworld {
            server()
            sourceSet = sourceSets.gametest
            gameDirectory = file('build/harness-server')
            systemProperty 'ender_obelisks.genworld', 'true'
            programArgument '--nogui'
        }
        harness {
            client()
            sourceSet = sourceSets.gametest
            gameDirectory = file('build/harness-client')
            systemProperty 'ender_obelisks.harness', 'true'
            programArguments.addAll '--quickPlaySingleplayer', 'harness', '--width', '1280', '--height', '720'
        }
    }
}
